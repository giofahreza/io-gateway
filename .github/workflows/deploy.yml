name: Build, Release and Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: io-gateway-deploy-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.detect.outputs.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed app files
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "app=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${REF_TYPE}" = "tag" ]; then
            previous_tag="$(git tag --sort=-v:refname | grep -E '^v[0-9]' | grep -vx "${REF_NAME}" | head -n 1 || true)"
            if [ -n "${previous_tag}" ]; then
              mapfile -t changed_files < <(git diff --name-only "${previous_tag}" "${REF_NAME}")
            else
              mapfile -t changed_files < <(git ls-tree -r --name-only "${REF_NAME}")
            fi
          elif [ -z "${BEFORE}" ] || [[ "${BEFORE}" =~ ^0+$ ]]; then
            if git rev-parse "${AFTER}^" >/dev/null 2>&1; then
              mapfile -t changed_files < <(git diff --name-only "${AFTER}^" "${AFTER}")
            else
              mapfile -t changed_files < <(git ls-tree -r --name-only "${AFTER}")
            fi
          else
            mapfile -t changed_files < <(git diff --name-only "${BEFORE}" "${AFTER}")
          fi

          app=false
          for path in "${changed_files[@]}"; do
            case "${path}" in
              Cargo.toml|Cargo.lock|config.example.json|.env.example|ecosystem.config.cjs|src/*|examples/*|scripts/test-iogw-performance.py|.github/workflows/deploy.yml)
                app=true
                ;;
            esac
          done

          printf 'Changed files:\n'
          printf '%s\n' "${changed_files[@]}"
          echo "app=${app}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build release binary
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Check dashboard JavaScript syntax
        run: |
          set -euo pipefail
          awk '/<script>/{flag=1;next} /<\/script>/{flag=0} flag' src/main.rs > /tmp/io-gateway-dashboard.js
          node --check /tmp/io-gateway-dashboard.js

      - name: Run tests
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Check terminal responsiveness
        run: python3 scripts/test-iogw-performance.py --binary target/release/iogw

      - name: Record checksum
        run: |
          sha256sum target/release/io-gateway > target/release/io-gateway.sha256
          sha256sum target/release/iogw > target/release/iogw.sha256

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: io-gateway-linux-x86_64
          path: |
            target/release/io-gateway
            target/release/io-gateway.sha256
            target/release/iogw
            target/release/iogw.sha256
          if-no-files-found: error

  package-release-assets:
    name: Package ${{ matrix.platform }} release asset
    runs-on: ${{ matrix.runner }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Use native runners for every published architecture.  The ARM64
          # runner labels are available to public repositories and avoid
          # relying on an untested cross-linker setup for release binaries.
          - platform: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            asset_suffix: linux-x86_64.tar.gz
            macosx_deployment_target: ''
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            asset_suffix: linux-aarch64.tar.gz
            macosx_deployment_target: ''
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            asset_suffix: macos-x86_64.tar.gz
            macosx_deployment_target: '10.13'
          - platform: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            asset_suffix: macos-aarch64.tar.gz
            macosx_deployment_target: '11.0'
          - platform: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip
            asset_suffix: windows-x86_64.zip
          - platform: windows-aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
            asset_suffix: windows-aarch64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-cargo-

      - name: Build and package Unix release asset
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${TARGET}"

          stage_dir="$(mktemp -d)"
          install -m 0755 "target/${TARGET}/release/io-gateway" "${stage_dir}/io-gateway"
          install -m 0755 "target/${TARGET}/release/iogw" "${stage_dir}/iogw"
          install -m 0644 config.example.json "${stage_dir}/config.example.json"

          mkdir -p dist
          tar -C "${stage_dir}" -czf "dist/io-gateway-${TAG}-${ASSET_SUFFIX}" \
            io-gateway iogw config.example.json

      - name: Build and package Windows release asset
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked --target "$env:TARGET"

          $stageDir = Join-Path $env:RUNNER_TEMP 'io-gateway-release-stage'
          Remove-Item -Recurse -Force $stageDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stageDir | Out-Null
          Copy-Item "target/$env:TARGET/release/io-gateway.exe" (Join-Path $stageDir 'io-gateway.exe')
          Copy-Item "target/$env:TARGET/release/iogw.exe" (Join-Path $stageDir 'iogw.exe')
          Copy-Item 'config.example.json' (Join-Path $stageDir 'config.example.json')

          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          $archive = "dist/io-gateway-$env:TAG-$env:ASSET_SUFFIX"
          Compress-Archive -Path (Join-Path $stageDir '*') -DestinationPath $archive -Force

      - name: Upload packaged release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/io-gateway-${{ github.ref_name }}-${{ matrix.asset_suffix }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - changes
      - build
      - package-release-assets
    # `build` is deliberately allowed to be skipped for a tag that changes
    # only documentation. If app code changed, a failed build/test job blocks
    # publication just as it blocks deployment.
    if: >-
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.changes.result == 'success' &&
      needs.package-release-assets.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout installer scripts
        uses: actions/checkout@v4

      - name: Download packaged release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: ./release-assets
          merge-multiple: true

      - name: Add installers and checksums
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/install.sh
          test -f scripts/install.ps1
          chmod 0755 scripts/install.sh
          cp scripts/install.sh release-assets/install.sh
          cp scripts/install.ps1 release-assets/install.ps1

          cd release-assets
          for asset in \
            "io-gateway-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            "io-gateway-${GITHUB_REF_NAME}-linux-aarch64.tar.gz" \
            "io-gateway-${GITHUB_REF_NAME}-macos-x86_64.tar.gz" \
            "io-gateway-${GITHUB_REF_NAME}-macos-aarch64.tar.gz" \
            "io-gateway-${GITHUB_REF_NAME}-windows-x86_64.zip" \
            "io-gateway-${GITHUB_REF_NAME}-windows-aarch64.zip" \
            install.sh \
            install.ps1
          do
            test -f "${asset}"
          done
          sha256sum \
            "io-gateway-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            "io-gateway-${GITHUB_REF_NAME}-linux-aarch64.tar.gz" \
            "io-gateway-${GITHUB_REF_NAME}-macos-x86_64.tar.gz" \
            "io-gateway-${GITHUB_REF_NAME}-macos-aarch64.tar.gz" \
            "io-gateway-${GITHUB_REF_NAME}-windows-x86_64.zip" \
            "io-gateway-${GITHUB_REF_NAME}-windows-aarch64.zip" \
            install.sh \
            install.ps1 > SHA256SUMS

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* --clobber
          else
            gh release create "${TAG}" release-assets/* \
              --generate-notes \
              --title "${TAG}"
          fi

  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    needs:
      - changes
      - build
    if: needs.changes.outputs.app == 'true' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_REMOTE_STAGE_DIR: ${{ secrets.DEPLOY_REMOTE_STAGE_DIR }}
      DEPLOY_LIVE_BINARY: ${{ secrets.DEPLOY_LIVE_BINARY }}
      DEPLOY_SERVICE_NAME: ${{ secrets.DEPLOY_SERVICE_NAME }}
      DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
      DEPLOY_READY_URL: ${{ secrets.DEPLOY_READY_URL }}

    steps:
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: io-gateway-linux-x86_64
          path: ./release

      - name: Validate deployment secrets
        run: |
          set -euo pipefail
          missing=false
          for name in \
            DEPLOY_HOST \
            DEPLOY_USER \
            DEPLOY_SSH_KEY \
            DEPLOY_REMOTE_STAGE_DIR \
            DEPLOY_LIVE_BINARY \
            DEPLOY_SERVICE_NAME \
            DEPLOY_HEALTH_URL \
            DEPLOY_READY_URL
          do
            if [ -n "${!name}" ]; then
              echo "::add-mask::${!name}"
            fi
            if [ -z "${!name}" ]; then
              echo "::error title=Missing deployment secret::${name} is required for deployment."
              missing=true
            fi
          done
          if [ "${missing}" = "true" ]; then
            exit 1
          fi

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Upload binary
        run: |
          set -euo pipefail
          chmod +x ./release/io-gateway
          EXPECTED_SHA256="$(awk '{print $1}' ./release/io-gateway.sha256)"
          if [ -z "${EXPECTED_SHA256}" ]; then
            echo "Failed to read release checksum." >&2
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::12}"
          STAGED_BINARY="${DEPLOY_REMOTE_STAGE_DIR}/io-gateway.${SHORT_SHA}"
          scp \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            ./release/io-gateway \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${STAGED_BINARY}"
          echo "STAGED_BINARY=${STAGED_BINARY}" >> "${GITHUB_ENV}"
          echo "EXPECTED_SHA256=${EXPECTED_SHA256}" >> "${GITHUB_ENV}"

      - name: Install and restart service
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_COMMIT='${GITHUB_SHA}' DEPLOY_REF='${GITHUB_REF_NAME}' STAGED_BINARY='${STAGED_BINARY}' LIVE_BINARY='${DEPLOY_LIVE_BINARY}' SERVICE_NAME='${DEPLOY_SERVICE_NAME}' HEALTH_URL='${DEPLOY_HEALTH_URL}' READY_URL='${DEPLOY_READY_URL}' EXPECTED_SHA256='${EXPECTED_SHA256}' bash -s" <<'REMOTE'
          set -euo pipefail

          test -x "${STAGED_BINARY}"
          STAGED_SHA256="$(sha256sum "${STAGED_BINARY}" | awk '{print $1}')"
          if [ "${STAGED_SHA256}" != "${EXPECTED_SHA256}" ]; then
            echo "Staged binary checksum ${STAGED_SHA256}, expected ${EXPECTED_SHA256}" >&2
            exit 1
          fi

          BACKUP="${LIVE_BINARY}.bak.$(date +%Y%m%d%H%M%S)"
          if [ -e "${LIVE_BINARY}" ]; then
            sudo cp "${LIVE_BINARY}" "${BACKUP}"
          fi
          sudo install -o root -g root -m 755 "${STAGED_BINARY}" "${LIVE_BINARY}"
          sudo systemctl restart "${SERVICE_NAME}"
          systemctl is-active "${SERVICE_NAME}"

          for attempt in $(seq 1 30); do
            if curl -fsS "${HEALTH_URL}"; then
              echo
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              echo "Health check failed after restart" >&2
              exit 1
            fi
            sleep 1
          done

          curl -fsS "${READY_URL}"
          echo

          LIVE_SHA256="$(sha256sum "${LIVE_BINARY}" | awk '{print $1}')"
          if [ "${LIVE_SHA256}" != "${EXPECTED_SHA256}" ]; then
            echo "Live binary checksum ${LIVE_SHA256}, expected ${EXPECTED_SHA256}" >&2
            exit 1
          fi
          sha256sum "${LIVE_BINARY}"

          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REVISION_PATH="$(dirname "${LIVE_BINARY}")/revision.json"
          printf '{"commit":"%s","ref":"%s","sha256":"%s","deployed_at":"%s"}\n' \
            "${DEPLOY_COMMIT}" "${DEPLOY_REF}" "${LIVE_SHA256}" "${DEPLOYED_AT}" \
            | sudo tee "${REVISION_PATH}" >/dev/null
          REMOTE
