[package]
name = "io-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["http1", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "process", "io-util", "sync"] }
tower = { version = "0.5", features = ["limit"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
http = "1"
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
url = "2.5"
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
async-stream = "0.3"
serde_urlencoded = "0.7"
utoipa = { version = "5.4", features = ["macros"] }
utoipa-swagger-ui = "9.0.2"
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2.9"
argon2 = "0.5"
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
libc = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
ratatui = "0.29"
